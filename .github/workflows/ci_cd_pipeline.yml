name: CI/CD Back - Gestion des transports

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sonarqube:
    name: Tests, JaCoCo, Build et analyse SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Installer jq
        run: sudo apt-get install jq

      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache des dépendances Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Analyse SonarCloud avec tests et JaCoCo
        env:
          env:
            SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
            JWT_SECRET: ${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
            DB_USERNAME: ${{ secrets.DB_USERNAME }}
            DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar 
            -Dsonar.projectKey=DIGINAMIC-Groupe1-Transport_transport-back 
            -Dsonar.organization=diginamic-groupe1-transport 
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Archivage du rapport JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Archivage des artefacts
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

